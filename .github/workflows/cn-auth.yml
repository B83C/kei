name: Experimental China authentication image

on:
  push:
    branches: [fix/cn-auth-global-v0253]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev
      - name: Install Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt && rustup default 1.95.0
      - name: Verify formatting
        run: cargo fmt --all --check
      - name: Check all targets and features
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Authentication regression tests
        run: cargo test --locked --lib auth::
  image:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: linux/amd64
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/B83C/kei
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Experimental China authentication endpoint split on kei 0.25.3
          tags: |
            ghcr.io/b83c/kei:0.25.3-cn-auth
            ghcr.io/b83c/kei:cn-auth-${{ github.sha }}
          cache-from: type=gha,scope=cn-auth
          cache-to: type=gha,scope=cn-auth,mode=max
